name: build installers

# Builds the desktop app for Windows, macOS (Apple silicon + Intel) and Linux on GitHub's free runners.
#   - push a tag like v0.1.0           -> builds everything and creates a DRAFT release with the installers attached
#   - run manually (Actions tab)       -> builds everything; installers are downloadable as workflow artifacts
#                                         (fill in 'release_tag' to also create the draft release)
# Tests + typecheck run first; installers are not built if they fail.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: type a version like v0.1.0 to also create a DRAFT GitHub release with the installers attached'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  installers:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64,  os: windows-latest, args: '--win --x64' }
          - { name: mac-arm64,    os: macos-15,       args: '--mac --arm64' }
          - { name: mac-x64,      os: macos-15-intel, args: '--mac --x64', optional: true }
          - { name: linux-x64,    os: ubuntu-latest,  args: '--linux --x64' }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx electron-vite build
      # unsigned builds: no certificates needed. Windows shows 'unknown publisher', macOS needs right-click > open the first time.
      # macOS runners can fail 'hdiutil detach ... resource busy' while building the .dmg (background scanner holds the volume).
      - name: free macOS disk-image tooling
        if: runner.os == 'macOS'
        run: sudo pkill -9 XProtect >/dev/null 2>&1 || true
      - name: package (retries flaky runner steps up to 3 times)
        shell: bash
        run: |
          for i in 1 2 3; do
            npx electron-builder ${{ matrix.args }} --publish never && exit 0
            echo "attempt $i failed; retrying in 15s"; sleep 15
          done
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: imagine-booth-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
